name: Publish kdna-vscode

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'aikdna/kdna-vscode' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Fetch the canonical release tag
        run: git fetch --force --tags origin

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
          check-latest: false
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: node --version | grep -Fx v22.23.1

      - run: npm ci --ignore-scripts

      - name: Verify release event, tag, commit, package, and changelog
        run: npm run release:check

      - run: npm test

      - run: npm run lint

      - name: Select the retained VSIX path
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "KDNA_VSIX=$RUNNER_TEMP/kdna-vscode-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Build one retained VSIX
        run: ./node_modules/.bin/vsce package --out "$KDNA_VSIX"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kdna-vscode-release-candidate
          path: ${{ env.KDNA_VSIX }}

      - name: Publish the retained VSIX to VS Code Marketplace
        run: ./node_modules/.bin/vsce publish --packagePath "$KDNA_VSIX"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
