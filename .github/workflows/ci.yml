name: kdna-vscode CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npx vsce package

  cli-contract:
    name: cli-contract (real pinned kdna-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: aikdna/kdna-cli
          ref: 8bbd47c2f436bf638e6393aeda029e5fcba1bd32
          path: .cross-repo/kdna-cli
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - name: Install the pinned CLI dependencies
        working-directory: .cross-repo/kdna-cli
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the pinned CLI version
        run: node .cross-repo/kdna-cli/src/cli.js --version | grep -Fx 0.36.1
      - name: Real-CLI workspace attachment contract
        run: npm run test:cli-contract
        env:
          KDNA_CLI_ENTRY: ${{ github.workspace }}/.cross-repo/kdna-cli/src/cli.js

  macos-keychain-isolation:
    name: macos-keychain-isolation
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Integration tests (mock macOS Keychain)
        run: npm run test:integration
