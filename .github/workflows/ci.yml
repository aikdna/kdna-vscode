name: kdna-vscode CI

on:
  push:
    branches: [main]
    paths:
      - 'kdna-vscode/**'
  pull_request:
    branches: [main]
    paths:
      - 'kdna-vscode/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: kdna-vscode

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: kdna-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Webpack build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration
        continue-on-error: true  # optional; requires display server

      - name: Package VSIX
        run: npx vsce package
