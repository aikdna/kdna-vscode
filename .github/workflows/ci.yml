name: kdna-vscode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npx vsce package

  candidate-provenance:
    name: candidate-provenance
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: aikdna/kdna
          ref: 06fc87c435a6a34a4b3df8eb18e61b7297ca232a
          path: ./kdna
      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
      - run: npm install -g npm@11.17.0 && npm --version && node --version
      - run: npm ci --ignore-scripts
      - run: npm run provenance
        env:
          KDNA_CORE_REPO: ./kdna
